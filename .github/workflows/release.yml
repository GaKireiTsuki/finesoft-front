name: Release

on:
    push:
        branches:
            - main
    # Retry the versions already committed to main without another version bump.
    workflow_dispatch:

concurrency:
    group: release-main
    cancel-in-progress: false

permissions:
    contents: read

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    quality:
        name: Quality
        if: github.ref == 'refs/heads/main'
        uses: ./.github/workflows/quality.yml

    release:
        name: Publish packages
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            id-token: write
        steps:
            # Build the same source revision that passed Quality.
            - name: Checkout tested revision
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Check main has not advanced
              run: |
                  git fetch origin main
                  if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
                      echo "::error::main has advanced. Let the newer push run, or dispatch Release on main to retry."
                      exit 1
                  fi

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: 24
                  run-install: false
                  cache: false

            - name: Install dependencies
              run: vp install --frozen-lockfile

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Version packages
              if: github.event_name == 'push'
              run: |
                  vp run release:auto:changeset
                  vp run version
                  vp install --lockfile-only --no-frozen-lockfile

            - name: Build release
              run: vp run -r build

            - name: Verify publish transforms
              run: vp exec node scripts/verify-publish-transforms.mjs

            # The pre-commit hook loads the root Vite config and needs built packages.
            - name: Commit release versions
              if: github.event_name == 'push'
              run: |
                  git add .changeset packages/*/package.json packages/*/CHANGELOG.md pnpm-lock.yaml
                  git commit -m "chore(release): version packages"

            # A normal fast-forward push must succeed before any package is published.
            # GITHUB_TOKEN pushes do not recursively trigger the push workflow.
            - name: Push version commit to main
              run: git push origin HEAD:main

            # pnpm 11 (selected by vp/Changesets) supports npm OIDC natively.
            # Both npm packages must trust this repository's release.yml workflow.
            - name: Publish with npm trusted publishing
              id: publish
              env:
                  NPM_CONFIG_PROVENANCE: true
              run: vp run release:publish

            # Recover missing tags too, including a retry after npm publish succeeded.
            - name: Push release tags
              id: tags
              run: |
                  vp run changeset tag
                  git push origin --tags

            - name: Summarize release
              if: always()
              env:
                  PUBLISH_RESULT: ${{ steps.publish.outcome }}
                  TAGS_RESULT: ${{ steps.tags.outcome }}
              run: |
                  {
                      echo "## Release"
                      echo "- npm publish: ${PUBLISH_RESULT:-not run}"
                      echo "- Git tags: ${TAGS_RESULT:-not run}"
                      if [[ "$PUBLISH_RESULT" == "success" && "$TAGS_RESULT" == "success" ]]; then
                          node -e 'for (const dir of ["front", "create-app"]) { const p = require(`./packages/${dir}/package.json`); console.log(`- ${p.name}@${p.version}`); }'
                      else
                          echo "- After resolving the failure, run Release manually on main to retry the committed versions."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
