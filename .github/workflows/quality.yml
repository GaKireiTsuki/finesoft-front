name: Quality

on:
    pull_request:
    workflow_dispatch:
    workflow_call:

concurrency: quality-${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: 24
                  run-install: false
                  cache: true

            - name: Install dependencies
              run: vp install --frozen-lockfile

            # The root config's controller generator imports the built core package.
            - name: Build framework packages
              run: vp run --filter '@finesoft/front...' build

            - name: Run formatting, lint, and type checks
              run: vp check

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: 24
                  run-install: false
                  cache: true

            - name: Install dependencies
              run: vp install --frozen-lockfile

            - name: Build framework packages
              run: vp run --filter '@finesoft/front...' build

            - name: Run coverage
              run: vp test --coverage

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: reports/coverage
                  if-no-files-found: error
