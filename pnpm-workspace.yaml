packages:
    - "packages/*"
    - "templates/*"
    - "adversarial/target-app"

catalog:
    "@changesets/cli": ^2.31.1
    "@types/node": ^22.20.1
    "@vitest/coverage-v8": 4.1.10
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@0.2.8
    vite-plus: 0.2.8
    vitest: 4.1.10

catalogMode: prefer
allowBuilds:
    esbuild: true
overrides:
    vite: "catalog:"
    vitest: "catalog:"
    "esbuild@>=0.27.3 <0.28.1": "0.28.2"
    "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
    "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
    "postcss@<8.5.10": ">=8.5.10"
    "ws@<8.20.1": ">=8.20.1"
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
