packages:
    - "packages/*"
    - "templates/*"
    - "adversarial/target-app"
    - "adversarial/runtime-app"

catalog:
    "@changesets/cli": ^2.31.1
    "@hono/node-server": ^2.1.0
    "@types/node": ^22.20.1
    "@vitest/coverage-v8": 4.1.11
    miniflare: 5.20260911.0-alpha
    parse5: ^8.0.1
    playwright: ^1.63.0
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@0.2.8
    vite-plus: 0.2.8
    vitest: 4.1.11

catalogMode: prefer
allowBuilds:
    esbuild: true
    workerd: true
overrides:
    vite: "catalog:"
    vitest: "catalog:"
    "@vitest/browser": "4.1.11"
    "@vitest/browser-preview": "4.1.11"
    "@vitest/expect": "4.1.11"
    "@vitest/mocker": "4.1.11"
    "@vitest/pretty-format": "4.1.11"
    "@vitest/runner": "4.1.11"
    "@vitest/snapshot": "4.1.11"
    "@vitest/spy": "4.1.11"
    "@vitest/utils": "4.1.11"
    "hono@>=4.0.0 <4.13.5": "^4.13.5"
    "devalue@>=5.0.0 <5.9.2": "5.9.2"
    "esbuild@>=0.27.3 <0.28.1": "0.28.2"
    "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
    "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
    "postcss@<8.5.10": ">=8.5.10"
    "ws@<8.20.1": ">=8.20.1"
# Keep Vite+'s ESM/CJS coverage guard aligned with the patched Vitest family.
patchedDependencies:
    "vite-plus@0.2.8": patches/vite-plus@0.2.8.patch

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
